<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Fdel Röte Jazz Orchester</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="navbar">
    <a class="nav-logo" href="index.html">FRJO</a>
    <button class="hamburger" id="hamburger" aria-label="メニュー" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="live.html">Live</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="page-hero">
    <div>
      <h1 class="section-title" style="margin-bottom:0;">Contact</h1>
      <p>Booking / Press / General Inquiry</p>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div style="max-width:700px;margin:0 auto;">
        <p style="text-align:center;color:var(--gray);margin-bottom:48px;line-height:1.8;">
          ライブブッキング・その他のお問い合わせは下記フォームよりご連絡ください。<br>
        </p>

        <form id="contact-form" class="contact-form slide-up" novalidate>
          <div class="form-group">
            <label for="name">お名前 / Name</label>
            <input type="text" id="name" name="name" placeholder="Yamada Taro" autocomplete="name" required>
          </div>
          <div class="form-group">
            <label for="email">メールアドレス / Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="subject">件名 / Subject</label>
            <input type="text" id="subject" name="subject" placeholder="Booking Inquiry">
          </div>
          <div class="form-group">
            <label for="message">メッセージ / Message</label>
            <textarea id="message" name="message" placeholder="ご用件をお書きください…" required></textarea>
          </div>
          <button type="submit" class="btn" style="align-self:flex-start;">Send Message</button>
          <p id="form-status" class="form-status" role="alert"></p>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="crimson-rule"></div>
      <div class="footer-logo">Fdel Röte Jazz Orchester</div>
      <ul class="footer-nav">
        <li><a href="about.html">About</a></li>
        <li><a href="members.html">Members</a></li>
        <li><a href="live.html">Live</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <p class="footer-copy">&copy; 2026 Fdel Röte Jazz Orchester. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
